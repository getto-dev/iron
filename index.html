<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymPro Trainer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Экран анкеты -->
        <div id="screen-questionnaire" class="screen active">
            <h1>Анкета тренирующегося</h1>
            <div class="form-group">
                <label>Пол</label>
                <div class="button-group">
                    <button class="btn" data-gender="male" onclick="setGender('male')">Мужской</button>
                    <button class="btn" data-gender="female" onclick="setGender('female')">Женский</button>
                </div>
            </div>

            <div class="form-group">
                <label>Статус</label>
                <div class="button-group">
                    <button class="btn" data-status="natural" onclick="setStatus('natural')">Натурал</button>
                    <button class="btn" data-status="enhanced" onclick="setStatus('enhanced')">Химик</button>
                </div>
            </div>

            <div class="form-group">
                <label>Вес (кг)</label>
                <input type="number" id="weight" placeholder="80" min="1" step="0.1">
            </div>

            <div class="form-group">
                <label>Рост (см)</label>
                <input type="number" id="height" placeholder="180" min="1" step="0.1">
            </div>

            <div class="form-group">
                <label>1ПМ жим лежа (кг)</label>
                <input type="number" id="bench1rm" placeholder="100" min="1" step="0.5">
            </div>

            <div class="form-group">
                <label>1ПМ присед (кг)</label>
                <input type="number" id="squat1rm" placeholder="140" min="1" step="0.5">
            </div>

            <div class="form-group">
                <label>1ПМ становая тяга (кг)</label>
                <input type="number" id="deadlift1rm" placeholder="160" min="1" step="0.5">
            </div>

            <div class="form-group">
                <label>Цель тренировок</label>
                <div class="button-group">
                    <button class="btn" data-goal="hypertrophy" onclick="setGoal('hypertrophy')">Гипертрофия</button>
                    <button class="btn" data-goal="strength" onclick="setGoal('strength')">Сила</button>
                    <button class="btn" data-goal="endurance" onclick="setGoal('endurance')">Выносливость</button>
                </div>
            </div>

            <button class="btn primary" onclick="calculateProgram()">Рассчитать программу</button>
        </div>

        <!-- Экран выбора тренировки -->
        <div id="screen-training-select" class="screen">
            <h1>Выберите тренировку</h1>
            <p id="user-info"></p>
            <div id="training-buttons" class="button-group vertical">
                <button class="btn primary" onclick="startTraining('A')">Тренировка A (грудь + спина + ноги)</button>
                <button class="btn primary" onclick="startTraining('B')">Тренировка B (плечи + руки + ноги)</button>
                <button class="btn primary" onclick="startTraining('C')">Тренировка C (грудь + спина + ноги)</button>
            </div>
            <button class="btn secondary" onclick="backToQuestionnaire()">Назад к анкете</button>
        </div>

        <!-- Экран упражнения -->
        <div id="screen-exercise" class="screen">
            <h1 id="exercise-title">Упражнение</h1>
            <div class="exercise-card">
                <div class="exercise-number" id="exercise-number">1 / 6</div>
                <div class="exercise-name" id="exercise-name">Жим лёжа</div>
                <div class="exercise-muscle" id="exercise-muscle">Грудь, трицепс</div>
                <div class="exercise-params">
                    <div class="param">
                        <span class="param-label">Вес (кг)</span>
                        <span class="param-value" id="exercise-weight">80</span>
                    </div>
                    <div class="param">
                        <span class="param-label">Подходы</span>
                        <span class="param-value" id="exercise-sets">5</span>
                    </div>
                    <div class="param">
                        <span class="param-label">Повторы</span>
                        <span class="param-value" id="exercise-reps">6-8</span>
                    </div>
                </div>
                <div class="exercise-rest" id="exercise-rest">Отдых: 75 сек</div>
            </div>
            <button class="btn primary" onclick="nextExercise()">Следующее упражнение</button>
            <button class="btn secondary" onclick="backToTrainingSelect()">К списку тренировок</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
